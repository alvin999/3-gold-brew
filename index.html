<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模擬手沖咖啡 - Barista's Challenge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Silkscreen&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="app">
    <div class="game-container">
      <!-- 渲染容器 -->
      <div id="three-container" class="hidden"></div>
      <div id="pixi-container" class="hidden"></div>

      <!-- HUD: 遊戲中的簡約資訊與控制 -->
      <div id="game-hud" class="hud hidden">
        <div class="status-panel glass">
          <h1 class="game-title">3 Gold Brew</h1>
          <div class="controls">
            <!-- 現已由 PixiJS GameMenu 取代 -->
            <button id="toggle-calc-btn" type="button" class="ctrl-btn highlight hidden">MODE SETTINGS</button>
          </div>
        </div>
      </div>

      <!-- 視角選擇器 -->
      <div id="view-selector" class="view-panel glass hidden">
        <button class="view-btn active" data-view="廣角全景">全景</button>
        <button class="view-btn" data-view="職人視角">職人</button>

        <div class="divider"></div>
        <button id="free-view-btn" class="view-btn">自由</button>
      </div>

      <!-- 沖煮開始按鈕 (CSS Overlay) -->
      <div id="brew-start-overlay" class="hidden">
        <button id="brew-start-btn" class="brew-big-btn">START BREWING</button>
      </div>

    </div>
  </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
